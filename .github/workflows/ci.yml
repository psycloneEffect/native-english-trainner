# PR と main への push ごとに、CLAUDE.md の Verification と同じ検証を実行する。
# package.json を置かない方針なので、npm ci や npm run は使わない。
# 実際のデプロイは Cloudflare 側が行うので、ここでは Secrets を使わず dry-run までにとどめる。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # 必須チェックはジョブ名で指定するので、PR の版チェック（version-check の check）と別の名前にする
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # npx で取得したコードが動くので、トークンを .git/config に残さない
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 構文チェック
        run: for f in worker/*.js public/app.js public/shared/schema.js; do node --check "$f"; done

      # エージェントの権限はこのテストで守っているので、ポリシーやスキルの変更で壊れていないか確かめる
      - name: フックのテスト
        run: node --test .claude/hooks/hooks.test.mjs

      # Worker の API を偽の KV と Claude の応答で通しで確かめる。実際の Claude API は呼ばない
      - name: アプリのテスト
        run: node --test "tests/**/*.test.mjs"

      - name: Worker のビルド確認
        run: npx --yes wrangler@4 deploy --dry-run --outdir "$(mktemp -d)"
